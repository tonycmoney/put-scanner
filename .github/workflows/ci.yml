name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: scanner
          POSTGRES_DB: scanner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scanner"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check . ../scripts
          ruff format --check . ../scripts
      - name: Tests (SQLite)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql://scanner:scanner@localhost:5432/scanner
        run: pytest -q
      - name: No order placement code
        run: |
          # The scanner is alerts only. Fail if anything calls a Webull trading
          # order endpoint.
          ! grep -rniE "/trade/order|/openapi/trade|place_?order|orders/(place|replace|cancel)" app

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          set +e
          docker build --progress=plain -t put-scanner . > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            msg=$(tail -40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=docker build failed::$msg"
          fi
          exit $status
      - name: Container serves the dashboard and stays idle without keys
        run: |
          docker run -d -p 8000:8000 --name app put-scanner
          ok=0
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && ok=1 && break; sleep 1; done
          docker logs app
          [ "$ok" = 1 ]
          curl -sf localhost:8000/ | grep -q "Put Scanner"
          curl -sf localhost:8000/api/status | grep -q '"configured":false'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/scan)
          [ "$code" = 503 ]
